version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Conakry }
    open-pull-requests-limit: 5
    labels: ["type:devops", "dependencies"]
    commit-message: { prefix: "build(deps)" }
    groups:
      flutter-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Conakry }
    labels: ["type:devops", "dependencies"]
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    labels: ["type:devops", "dependencies", "comp:android"]
    commit-message: { prefix: "build(deps)" }
