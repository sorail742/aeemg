# Sécurité : secrets versionnés, vulnérabilités des dépendances, revue des nouvelles dépendances.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1' # chaque lundi : nouvelles CVE sur des dépendances inchangées
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installer gitleaks
        env:
          GITLEAKS_VERSION: '8.24.3'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scanner l'historique complet
        run: gitleaks git --redact --verbose --exit-code 1 .

  dependencies:
    name: dependencies (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Installer osv-scanner
        env:
          OSV_VERSION: '2.0.2'
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      # pubspec.lock (Dart), deno.lock (Edge Functions) et gradle s'ils existent.
      - name: Vulnérabilités connues (OSV)
        run: osv-scanner scan source --recursive --format table .

  dependency-review:
    name: dependency-review
    # Exige « Dependency graph » (OPS-004), vérifié par l'étape « Graphe de dépendances actif ? ».
    # DEPENDENCY_REVIEW=false désactive le job.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # Tant que « Dependency graph » est désactivé (Settings → Code security, réservé au
      # propriétaire), l'API répond 403/404 : le job le signale au lieu d'échouer.
      - name: Graphe de dépendances actif ?
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/dependency-graph/compare/$RANGE" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Dependency graph désactivé : revue des dépendances ignorée. L'activer dans https://github.com/$GITHUB_REPOSITORY/settings/security_analysis (OPS-004)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # Refuse les nouvelles dépendances vulnérables (≥ modérée) ou sous licence incompatible.
      - uses: actions/dependency-review-action@v5
        if: steps.graph.outputs.enabled == 'true'
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: on-failure
