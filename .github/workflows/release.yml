# Release : tag vX.Y.Z → builds Android (AAB/APK signés), Web, SBOM, CHANGELOG, release GitHub.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Le tag correspond à la version du pubspec
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag v$tag ≠ version du pubspec.yaml ($version) (ADR-0016)."
            exit 1
          fi
      - name: Politiques de release (bloquantes)
        run: tool/ci/check_repo_policies.sh
        env:
          ERROR_RULES: secrets forbidden-files service-role android-release env-asset

  android:
    name: android (AAB + APK)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Keystore de release (SEC-020, OPS-003)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_PROPERTIES" ]]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PROPERTIES absents : pas de release signée avec la clé de debug."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
      - name: Configuration de production (SEC-019, ADR-0009)
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if [[ -z "$APP_CONFIG_JSON" ]]; then echo "::error::Secret APP_CONFIG_JSON absent."; exit 1; fi
          printf '%s\n' "$APP_CONFIG_JSON" > config/prod.json
          python3 -c 'import json,sys; d=json.load(open("config/prod.json")); sys.exit(0 if d.get("SUPABASE_URL") and d.get("SUPABASE_ANON_KEY") else 1)' \
            || { echo "::error::APP_CONFIG_JSON doit être un JSON avec SUPABASE_URL et SUPABASE_ANON_KEY."; exit 1; }
          if grep -qE 'service_role|c2VydmljZV9yb2xl|sk_live_' config/prod.json; then
            echo "::error::APP_CONFIG_JSON contient une clé secrète (service_role…) : elle serait publiée dans l'app."; exit 1
          fi
      - run: flutter pub get
      - run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --dart-define-from-file=config/prod.json
      - run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --dart-define-from-file=config/prod.json
      - name: Nettoyer les secrets
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties config/prod.json
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-symbols
          path: build/symbols
          retention-days: 90

  web:
    name: web
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configuration de production (SEC-019, ADR-0009)
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if [[ -z "$APP_CONFIG_JSON" ]]; then echo "::error::Secret APP_CONFIG_JSON absent."; exit 1; fi
          printf '%s\n' "$APP_CONFIG_JSON" > config/prod.json
          python3 -c 'import json,sys; d=json.load(open("config/prod.json")); sys.exit(0 if d.get("SUPABASE_URL") and d.get("SUPABASE_ANON_KEY") else 1)' \
            || { echo "::error::APP_CONFIG_JSON doit être un JSON avec SUPABASE_URL et SUPABASE_ANON_KEY."; exit 1; }
          if grep -qE 'service_role|c2VydmljZV9yb2xl|sk_live_' config/prod.json; then
            echo "::error::APP_CONFIG_JSON contient une clé secrète (service_role…) : elle serait publiée dans l'app."; exit 1
          fi
      - run: flutter pub get
      - run: flutter build web --release --dart-define-from-file=config/prod.json
      - run: rm -f config/prod.json
      - run: tar -czf web-build.tar.gz -C build web
      - uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: web-build.tar.gz

  publish:
    name: publish
    needs: [android, web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: SBOM (inventaire des dépendances)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
      - name: Notes de version (Conventional Commits)
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          {
            echo "## ${GITHUB_REF_NAME}"
            for t in "feat:Fonctionnalités" "sec:Sécurité" "fix:Corrections" "perf:Performance" "refactor:Refactoring"; do
              key="${t%%:*}"; label="${t#*:}"
              lines=$(git log --format='- %s (%h)' "$range" | grep -E "^- ${key}(\(|!|:)" || true)
              [[ -n "$lines" ]] && printf '\n### %s\n%s\n' "$label" "$lines"
            done
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/android-release/**/*
            dist/web-release/web-build.tar.gz
            dist/sbom.spdx.json
