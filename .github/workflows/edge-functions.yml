# Edge Functions (Deno) : format, lint, typage, tests (ADR-0019).
name: edge-functions

on:
  push:
    branches: [main, develop]
    paths: ['supabase/functions/**', '.github/workflows/edge-functions.yml']
  pull_request:
    paths: ['supabase/functions/**', '.github/workflows/edge-functions.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: supabase/functions

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task fmt:check
      - run: deno task lint
      - run: deno task typecheck
      - run: deno task test
