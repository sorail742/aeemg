# Compatibilité : builds Android / iOS / Web(Wasm), version Flutter suivante, tests sur émulateur.
name: compatibility

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.fvmrc'
      - 'pubspec.*'
      - 'android/**'
      - 'ios/**'
      - 'web/**'
      - 'lib/**'
      - '.github/workflows/compatibility.yml'
  schedule:
    - cron: '0 2 * * *' # chaque nuit (02:00 UTC = 02:00 Conakry)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    # La version beta anticipe les ruptures de la prochaine version de Flutter : informative.
    continue-on-error: ${{ matrix.channel == 'beta' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # stable : version figée de .fvmrc (OPS-014) ; beta : dernière beta, pour anticiper la montée suivante.
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version-file: ${{ matrix.channel == 'stable' && '.fvmrc' || '' }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define-from-file=config/example.json
      - name: Taille de l'APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          du -h build/app/outputs/flutter-apk/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

  web-wasm:
    name: web (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informatif tant que AMEL-011 (suppression de dart:io) n'est pas livré.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter build web --wasm --release --dart-define-from-file=config/example.json

  ios:
    name: ios (no codesign)
    # Dépôt public : les minutes macOS sont gratuites, le build iOS tourne donc aussi sur les PR
    # (limitées par les chemins du déclencheur ci-dessus). Si le dépôt devient privé, remettre
    # `if: github.event_name != 'pull_request'` (macOS coûte 10× plus de minutes).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      # Le cache Swift Package Manager du runner macOS est parfois corrompu (« Could not resolve
      # package dependencies … cannot change to …/org.swift.swiftpm/repositories/… »). Dans ce cas
      # seulement, on vide ce cache et on relance le build une fois. Toute autre erreur échoue tout de suite.
      - name: flutter build ios
        run: |
          set -o pipefail
          build() { flutter build ios --release --no-codesign --dart-define-from-file=config/example.json 2>&1 | tee build.log; }
          if build; then exit 0; fi
          if ! grep -q 'Could not resolve package dependencies' build.log; then exit 1; fi
          echo "::warning::Résolution SwiftPM échouée (cache du runner) : cache vidé, nouvelle tentative."
          rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/org.swift.swiftpm ios/build build/ios
          build

  android-integration:
    name: android integration (API ${{ matrix.api-level }})
    # Tests de démarrage sur émulateur (OPS-010) : integration_test/app_test.dart.
    # Un émulateur est lourd (~8 min) : les PR et `main` testent seulement API 34. API 24 (minSdk),
    # dont l'image démarre lentement et se bloque parfois, tourne la nuit et à la demande.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[24, 34]' || '[34]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Présence de tests d'intégration
        id: detect
        run: |
          if compgen -G "integration_test/*.dart" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun test dans integration_test/ : job ignoré (OPS-010)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        if: steps.detect.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.present == 'true'
        with:
          flutter-version-file: .fvmrc
          cache: true
      - if: steps.detect.outputs.present == 'true'
        run: flutter pub get
      - name: Activer KVM
        if: steps.detect.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.detect.outputs.present == 'true'
        # Un émulateur bloqué échoue au bout de 20 min au lieu d'attendre la limite du job.
        timeout-minutes: 20
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          # Émulateur allégé : sans fenêtre, audio, caméra, animation de démarrage ni snapshot.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          # Démarrage limité à 7 min (10 par défaut) : un boot bloqué échoue plus tôt.
          emulator-boot-timeout: 420
          script: flutter test integration_test --dart-define-from-file=config/example.json
