name: aeemg
description: "AEEMG — Plateforme de gestion communautaire (Flutter + Supabase)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.18.3
  go_router: ^18.1.2
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  table_calendar: ^3.3.0
  hijri: ^3.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.6
  quran: ^1.4.1
  just_audio: ^0.10.6
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  timeago: ^3.7.1
  adhan: ^2.0.0+1
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  speech_to_text: ^7.5.0
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  emoji_picker_flutter: ^4.5.4
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  intl: 0.20.2

flutter:
  uses-material-design: true

  assets:
    - assets/data/hadiths.json
    - assets/data/quizzes.json
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/aeemg_logo.png"
